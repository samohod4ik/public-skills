name: Code quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize evidence directory
        if: always()
        run: mkdir -p "$RUNNER_TEMP/quality-evidence/logs" "$RUNNER_TEMP/quality-evidence/reports"

      - name: Check out exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Record exact candidate and select quality base
        id: policy
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ORIGINAL_MAIN_SHA: 71d67c469c6afe2cc35b2da4ab6dfbf22eb2062b
          REVIEWED_BOOTSTRAP_SHA: ac5ba766e618985241a5b148c61762f752548f35
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$PR_HEAD_SHA"
          test -f .quality.toml
          test -f requirements-quality.txt

          if git cat-file -e "$PR_BASE_SHA:.quality.toml" 2>/dev/null; then
            quality_base="$PR_BASE_SHA"
            bootstrap_fallback=false
          else
            test "$PR_BASE_SHA" = "$ORIGINAL_MAIN_SHA" || {
              echo "FAIL: base has no .quality.toml and is outside the reviewed initial-rollout case" >&2
              exit 1
            }
            git cat-file -e "$REVIEWED_BOOTSTRAP_SHA^{commit}"
            git merge-base --is-ancestor "$REVIEWED_BOOTSTRAP_SHA" "$PR_HEAD_SHA"
            actual_paths="$(git diff --name-only "$ORIGINAL_MAIN_SHA" "$REVIEWED_BOOTSTRAP_SHA" | LC_ALL=C sort)"
            expected_paths="$(printf '%s\n' .gitignore .quality.toml requirements-quality.txt | LC_ALL=C sort)"
            test "$actual_paths" = "$expected_paths" || {
              echo "FAIL: reviewed bootstrap commit contains unexpected files" >&2
              printf 'actual:\n%s\nexpected:\n%s\n' "$actual_paths" "$expected_paths" >&2
              exit 1
            }
            quality_base="$REVIEWED_BOOTSTRAP_SHA"
            bootstrap_fallback=true
          fi

          source_test_change=false
          docs_only_change=true
          changed_paths="$(git diff --name-only "$quality_base" "$PR_HEAD_SHA")"
          if [[ -z "$changed_paths" ]]; then
            docs_only_change=false
          else
            while IFS= read -r path; do
              case "$path" in
                hooks/*.py|tests/*.py) source_test_change=true ;;
              esac
              case "$path" in
                *.md|*.toml|*.json|*.yml|*.yaml) ;;
                *) docs_only_change=false ;;
              esac
              case "$path" in
                hooks|hooks/*) docs_only_change=false ;;
              esac
            done <<< "$changed_paths"
          fi

          {
            echo "quality_base=$quality_base"
            echo "bootstrap_fallback=$bootstrap_fallback"
            echo "source_test_change=$source_test_change"
            echo "docs_only_change=$docs_only_change"
          } >> "$GITHUB_OUTPUT"
          {
            echo "QUALITY_BASE=$quality_base"
            echo "BOOTSTRAP_FALLBACK=$bootstrap_fallback"
            echo "SOURCE_TEST_CHANGE=$source_test_change"
            echo "DOCS_ONLY_CHANGE=$docs_only_change"
          } >> "$GITHUB_ENV"
          {
            echo "candidate_head=$actual_head"
            echo "pull_request_base=$PR_BASE_SHA"
            echo "quality_base=$quality_base"
            echo "bootstrap_fallback=$bootstrap_fallback"
            echo "source_test_change=$source_test_change"
            echo "docs_only_change=$docs_only_change"
          } > "$RUNNER_TEMP/quality-evidence/selection.txt"

      - name: Install pinned quality tools
        id: tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-quality.txt "uv==0.12.18"

          constraint_file="$RUNNER_TEMP/quality-evidence/uv-constraints.txt"
          printf '%s\n' 'ruff==0.16.9' 'radon==6.0.1' > "$constraint_file"
          echo "UV_CONSTRAINT=$constraint_file" >> "$GITHUB_ENV"

          bun_prefix="$RUNNER_TEMP/bun-tool"
          npm install --prefix "$bun_prefix" --no-save bun@1.4.2
          bun_bin="$bun_prefix/node_modules/.bin/bun"
          test "$("$bun_bin" --version)" = "1.4.2"
          echo "$bun_prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "BUN_BIN=$bun_bin" >> "$GITHUB_ENV"

          engine="$RUNNER_TEMP/code-quality-engine"
          git clone --no-checkout https://github.com/smixs/code-quality.git "$engine"
          git -C "$engine" checkout --detach f2eb0b2ef190ae3cdd325c9f9f5cb24623fe6fd3
          test "$(git -C "$engine" rev-parse HEAD)" = "f2eb0b2ef190ae3cdd325c9f9f5cb24623fe6fd3"
          echo "QUALITY_ENGINE=$engine/scripts/quality.ts" >> "$GITHUB_ENV"

          {
            python -VV
            python -m pip show pytest pytest-cov coverage uv
            "$bun_bin" --version
            uv --version
            echo "ruff constraint: ruff==0.16.9"
            echo "radon constraint: radon==6.0.1"
            git -C "$engine" rev-parse HEAD
          } > "$RUNNER_TEMP/quality-evidence/tool-versions.txt" 2>&1
          {
            echo 'quality command: check --base SHA --since SHA --tests --no-deps'
            echo 'excluded by --no-deps: dependency-cruiser cycles and knip dead-code scans'
            echo 'other optional scanner skips remain recorded in each Code Quality report'
          } > "$RUNNER_TEMP/quality-evidence/quality-scope.txt"

      - name: Run full project tests and explicit public checks
        id: tests
        if: always() && steps.tools.outcome == 'success' && steps.policy.outcome == 'success'
        run: |
          set +e
          evidence="$RUNNER_TEMP/quality-evidence"
          run_capture() {
            name="$1"
            shift
            log="$evidence/logs/$name.log"
            start="$(date +%s.%N)"
            {
              printf 'command='
              printf '%q ' "$@"
              printf '\nstarted_at=%s\n' "$start"
            } > "$log"
            "$@" 2>&1 | tee -a "$log"
            code=${PIPESTATUS[0]}
            end="$(date +%s.%N)"
            printf 'exit_code=%s\nelapsed_seconds=%s\n' "$code" "$(python -c 'import sys; print(float(sys.argv[2])-float(sys.argv[1]))' "$start" "$end")" >> "$log"
            echo "${name}_status=$code" >> "$GITHUB_OUTPUT"
            echo "$start"
          }

          junit="$evidence/reports/full-tests.junit.xml"
          junit_started="$(date +%s.%N)"
          run_capture full_tests python -m pytest -q tests/ --junitxml="$junit" >/dev/null
          echo "junit_started_at=$junit_started" >> "$evidence/selection.txt"
          run_capture public_surface python tests/test_public_surface.py >/dev/null
          run_capture reminder_manual_runner python tests/test_remind_before_git_write.py >/dev/null
          python scripts/validate_quality_ci.py junit --report "$junit" --started-at "$junit_started" > "$evidence/logs/junit-validation.log" 2>&1
          junit_validation_status=$?
          cat "$evidence/logs/junit-validation.log"
          echo "junit_validation_status=$junit_validation_status" >> "$GITHUB_OUTPUT"

      - name: Run bootstrap and candidate Code Quality checks
        id: quality
        if: always() && steps.tools.outcome == 'success' && steps.policy.outcome == 'success'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ORIGINAL_MAIN_SHA: 71d67c469c6afe2cc35b2da4ab6dfbf22eb2062b
          REVIEWED_BOOTSTRAP_SHA: ac5ba766e618985241a5b148c61762f752548f35
        run: |
          set +e
          evidence="$RUNNER_TEMP/quality-evidence"
          bun_bin="$BUN_BIN"
          engine="$QUALITY_ENGINE"
          validator="$GITHUB_WORKSPACE/scripts/validate_quality_ci.py"
          run_quality() {
            name="$1"
            repo="$2"
            base="$3"
            shift 3
            log="$evidence/logs/$name.log"
            started="$(date +%s.%N)"
            {
              printf 'command=%q ' "$bun_bin" "$engine" check --repo "$repo" --base "$base" --since "$base" "$@"
              printf '\nstarted_at=%s\n' "$started"
            } > "$log"
            "$bun_bin" "$engine" check --repo "$repo" --base "$base" --since "$base" "$@" 2>&1 | tee -a "$log"
            code=${PIPESTATUS[0]}
            end="$(date +%s.%N)"
            printf 'exit_code=%s\nelapsed_seconds=%s\n' "$code" "$(python -c 'import sys; print(float(sys.argv[2])-float(sys.argv[1]))' "$started" "$end")" >> "$log"
            output_name="${name//-/_}"
            echo "${output_name}_status=$code" >> "$GITHUB_OUTPUT"
            echo "${output_name}_started_at=$started" >> "$GITHUB_OUTPUT"
            return 0
          }

          if [[ "$BOOTSTRAP_FALLBACK" == "true" ]]; then
            bootstrap_repo="$RUNNER_TEMP/quality-bootstrap"
            git worktree add --detach "$bootstrap_repo" "$REVIEWED_BOOTSTRAP_SHA"
            run_quality bootstrap-quality "$bootstrap_repo" "$ORIGINAL_MAIN_SHA" --no-deps
            bootstrap_status="$(sed -n 's/^bootstrap_quality_status=//p' "$GITHUB_OUTPUT" | tail -n 1)"
            bootstrap_started="$(sed -n 's/^bootstrap_quality_started_at=//p' "$GITHUB_OUTPUT" | tail -n 1)"
            mkdir -p "$evidence/reports/bootstrap"
            cp "$bootstrap_repo/.scratch/quality/check.json" "$evidence/reports/bootstrap/check.json" 2>/dev/null
            cp "$bootstrap_repo/.scratch/quality/check.md" "$evidence/reports/bootstrap/check.md" 2>/dev/null
            python "$validator" quality \
              --json-report "$bootstrap_repo/.scratch/quality/check.json" \
              --markdown-report "$bootstrap_repo/.scratch/quality/check.md" \
              --started-at "$bootstrap_started" --base "$ORIGINAL_MAIN_SHA" \
              --head "$REVIEWED_BOOTSTRAP_SHA" --exit-code "$bootstrap_status" \
              --bootstrap-config-only > "$evidence/logs/bootstrap-validation.log" 2>&1
            bootstrap_validation_status=$?
            cat "$evidence/logs/bootstrap-validation.log"
            echo "bootstrap_validation_status=$bootstrap_validation_status" >> "$GITHUB_OUTPUT"
            git worktree remove --force "$bootstrap_repo"
          else
            echo "bootstrap_quality_status=0" >> "$GITHUB_OUTPUT"
            echo "bootstrap_validation_status=0" >> "$GITHUB_OUTPUT"
          fi

          candidate_repo="$GITHUB_WORKSPACE"
          run_quality candidate-quality "$candidate_repo" "$QUALITY_BASE" --tests --no-deps
          candidate_status="$(sed -n 's/^candidate_quality_status=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          candidate_started="$(sed -n 's/^candidate_quality_started_at=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          mkdir -p "$evidence/reports/candidate"
          cp "$candidate_repo/.scratch/quality/check.json" "$evidence/reports/candidate/check.json" 2>/dev/null
          cp "$candidate_repo/.scratch/quality/check.md" "$evidence/reports/candidate/check.md" 2>/dev/null

          source_test_flag=()
          if [[ "$SOURCE_TEST_CHANGE" == "true" ]]; then
            source_test_flag+=(--source-test-change)
          fi
          if [[ "$DOCS_ONLY_CHANGE" == "true" ]]; then
            source_test_flag+=(--docs-only-change)
          fi
          python "$validator" quality \
            --json-report "$candidate_repo/.scratch/quality/check.json" \
            --markdown-report "$candidate_repo/.scratch/quality/check.md" \
            --started-at "$candidate_started" --base "$QUALITY_BASE" \
            --head "$PR_HEAD_SHA" --exit-code "$candidate_status" \
            "${source_test_flag[@]}" > "$evidence/logs/candidate-validation.log" 2>&1
          candidate_validation_status=$?
          cat "$evidence/logs/candidate-validation.log"
          echo "candidate_validation_status=$candidate_validation_status" >> "$GITHUB_OUTPUT"

          if ! git diff --quiet HEAD -- . || [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "FAIL: validation changed tracked or non-ignored candidate files" | tee "$evidence/logs/worktree-cleanliness.log"
            echo "candidate_clean_status=1" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_clean_status=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce reports and test outcomes
        if: always()
        env:
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          FULL_TESTS_STATUS: ${{ steps.tests.outputs.full_tests_status }}
          SURFACE_STATUS: ${{ steps.tests.outputs.public_surface_status }}
          REMINDER_STATUS: ${{ steps.tests.outputs.reminder_manual_runner_status }}
          JUNIT_STATUS: ${{ steps.tests.outputs.junit_validation_status }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CANDIDATE_QUALITY_STATUS: ${{ steps.quality.outputs.candidate_quality_status }}
          CANDIDATE_VALIDATION_STATUS: ${{ steps.quality.outputs.candidate_validation_status }}
          BOOTSTRAP_QUALITY_STATUS: ${{ steps.quality.outputs.bootstrap_quality_status }}
          BOOTSTRAP_VALIDATION_STATUS: ${{ steps.quality.outputs.bootstrap_validation_status }}
          CANDIDATE_CLEAN_STATUS: ${{ steps.quality.outputs.candidate_clean_status }}
        run: |
          set -euo pipefail
          failures=()
          [[ "$TOOLS_OUTCOME" == success ]] || failures+=("quality tools setup did not complete")
          [[ "$POLICY_OUTCOME" == success ]] || failures+=("quality base policy validation did not complete")
          [[ "$TESTS_OUTCOME" == success ]] || failures+=("test commands did not complete")
          [[ "$FULL_TESTS_STATUS" == 0 ]] || failures+=("full pytest suite failed or did not run")
          [[ "$SURFACE_STATUS" == 0 ]] || failures+=("public surface check failed or did not run")
          [[ "$REMINDER_STATUS" == 0 ]] || failures+=("reminder direct runner failed or did not run")
          [[ "$JUNIT_STATUS" == 0 ]] || failures+=("JUnit evidence is missing, stale, empty, or red")
          [[ "$QUALITY_OUTCOME" == success ]] || failures+=("Code Quality commands did not complete")
          [[ "$CANDIDATE_QUALITY_STATUS" == 0 ]] || failures+=("candidate Code Quality check found findings or errors")
          [[ "$CANDIDATE_VALIDATION_STATUS" == 0 ]] || failures+=("candidate report validation failed")
          [[ "$BOOTSTRAP_QUALITY_STATUS" == 0 ]] || failures+=("bootstrap config-only check failed")
          [[ "$BOOTSTRAP_VALIDATION_STATUS" == 0 ]] || failures+=("bootstrap report validation failed")
          [[ "$CANDIDATE_CLEAN_STATUS" == 0 ]] || failures+=("candidate worktree is dirty after validation")
          if ((${#failures[@]})); then
            printf 'FAIL %s\n' "${failures[@]}"
            exit 1
          fi
          echo "PASS full project checks, exact-head Code Quality reports, and candidate cleanliness"

      - name: Upload raw quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-quality-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quality-evidence/**
            .scratch/quality/**
          if-no-files-found: warn
          retention-days: 14
